<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12B5A6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dilbaz">
<meta name="application-name" content="Dilbaz">

<title>Dilbaz – A1’den B2’ye İngilizce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;--bg2:#F4F7FA;--ink:#22304A;--ink2:#6A7890;--ink3:#A7B2C2;--line:#E2E8F0;--line-d:#CBD5E1;
  --pri:#12B5A6;--pri-d:#0C8C80;--pri-l:#D8F5F1;--ok-ink:#0A7A6F;
  --gold:#FFC83D;--gold-d:#E3A008;--orange:#FF8A3D;
  --red:#FF4B4B;--red-d:#D63333;--red-l:#FFE4E4;--bad-ink:#C62828;
  --blue:#2F8CF0;--blue-d:#1F6CC4;--blue-l:#E1EFFE;--scrim:rgba(15,23,42,.5);
  --disp:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121C22;--bg2:#1B2830;--ink:#E8EEF2;--ink2:#9CABB6;--ink3:#5F707C;--line:#2A3A44;--line-d:#1E2C34;
  --pri-l:#0E3633;--ok-ink:#5EE0D2;--red-l:#3A1C21;--bad-ink:#FF8F8F;--blue-l:#13304F;--scrim:rgba(0,0,0,.6)}}
:root[data-theme="dark"]{
  --bg:#121C22;--bg2:#1B2830;--ink:#E8EEF2;--ink2:#9CABB6;--ink3:#5F707C;--line:#2A3A44;--line-d:#1E2C34;
  --pri-l:#0E3633;--ok-ink:#5EE0D2;--red-l:#3A1C21;--bad-ink:#FF8F8F;--blue-l:#13304F;--scrim:rgba(0,0,0,.6)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:600;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
#app{height:100%}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--disp);font-weight:800;line-height:1.15;margin:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
img,svg{max-width:100%}

/* buttons */
.btn{display:block;width:100%;font-family:var(--disp);font-weight:800;font-size:1.1rem;letter-spacing:.02em;border:0;border-radius:16px;padding:13px 20px 11px;background:var(--pri);color:#fff;box-shadow:0 4px 0 var(--pri-d);cursor:pointer;transition:transform .06s,box-shadow .06s,filter .15s}
.btn:hover:not(:disabled){filter:brightness(1.05)}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--pri-d)}
.btn:disabled{background:var(--line);color:var(--ink3);box-shadow:0 4px 0 var(--line-d);cursor:default}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.red:active{box-shadow:0 0 0 var(--red-d)}
.btn.ghost{background:transparent;color:var(--ink2);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.ghost:active{box-shadow:0 0 0 var(--line)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn + .btn{margin-top:12px}

/* page shell */
.page{max-width:600px;margin:0 auto;padding-bottom:110px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:2px solid var(--line)}
.stat{display:flex;align-items:center;gap:5px;font-family:var(--disp);font-weight:800;font-size:1.15rem;line-height:1}
.stat svg{width:26px;height:26px;flex:none}
.flag{width:36px;height:26px;border-radius:7px;overflow:hidden;box-shadow:0 0 0 2px var(--line)}
.flag svg{width:36px;height:26px;display:block}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:2px solid var(--line);display:flex;justify-content:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;max-width:180px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;background:none;border:2px solid transparent;border-radius:14px;cursor:pointer;color:var(--ink3);font-family:var(--disp);font-weight:700;font-size:.85rem}
.nav button svg{width:28px;height:28px}
.nav button.on{color:var(--pri);background:var(--pri-l);border-color:var(--pri)}

/* goal card */
.daily{margin:16px 16px 0;padding:14px 16px;border:2px solid var(--line);border-radius:18px;display:flex;align-items:center;gap:14px}
.daily .ic{width:44px;height:44px;flex:none;display:grid;place-items:center;background:var(--bg2);border-radius:12px}
.daily .ic svg{width:28px;height:28px}
.daily h3{font-size:1.05rem}
.daily .meta{font-size:.9rem;color:var(--ink2)}
.pbar{height:14px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--gold);transition:width .5s}

/* units & path */
.unit-head{position:relative;margin:22px 16px 0;border-radius:20px;padding:16px 18px;color:#fff;background:var(--uc);box-shadow:0 5px 0 var(--ud);display:flex;justify-content:space-between;align-items:center;gap:12px}
.unit-head small{display:block;font-weight:800;opacity:.85;font-size:.9rem}
.unit-head h2{font-size:1.45rem;margin:2px 0}
.unit-head p{margin:0;opacity:.9;font-size:.95rem}
.unit-head .uprog{flex:none;font-family:var(--disp);font-weight:800;font-size:1.1rem;background:rgba(255,255,255,.2);border-radius:12px;padding:6px 10px}
.unit.dim .unit-head{background:var(--line);box-shadow:0 5px 0 var(--line-d);color:var(--ink2)}
.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;padding:34px 0 18px}
.node-wrap{position:relative;transform:translateX(var(--x))}
.node-wrap.current{margin-top:44px}
.node-wrap.current::before{content:"";position:absolute;inset:-11px -11px -4px;border-radius:50%;border:7px solid var(--line)}
.node{position:relative;width:78px;height:72px;border-radius:50%;border:0;background:var(--uc);box-shadow:0 7px 0 var(--ud);display:grid;place-items:center;cursor:pointer;color:#fff;transition:transform .07s,box-shadow .07s}
.node svg{width:36px;height:36px}
.node:active{transform:translateY(6px);box-shadow:0 1px 0 var(--ud)}
.node.done{background:var(--gold);box-shadow:0 7px 0 var(--gold-d)}
.node.done:active{box-shadow:0 1px 0 var(--gold-d)}
.node.locked{background:var(--line);box-shadow:0 7px 0 var(--line-d);color:var(--ink3)}
.node.locked:active{box-shadow:0 1px 0 var(--line-d)}
.node.chest{background:none;box-shadow:none;width:84px;height:76px}
.node.chest svg{width:72px;height:72px}
.node.chest.locked svg{filter:grayscale(1) opacity(.45)}
.node.chest.opened svg{opacity:.55}
.node.chest:not(.locked):not(.opened){animation:wiggle 2.4s ease-in-out infinite}
.bubble{position:absolute;bottom:calc(100% + 18px);left:50%;translate:-50% 0;background:var(--bg);border:2px solid var(--line);color:var(--uc);font-family:var(--disp);font-weight:800;font-size:1.05rem;padding:7px 16px 5px;border-radius:12px;white-space:nowrap;animation:bob 1.5s ease-in-out infinite;z-index:2}
.bubble::after{content:"";position:absolute;top:100%;left:50%;width:12px;height:12px;background:var(--bg);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translate(-50%,-6px) rotate(45deg)}
.deco{position:absolute;right:6%;top:110px;width:120px;pointer-events:none}
.deco-em{width:110px;height:110px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-size:56px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:600px;background:var(--bg);border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));animation:up .26s cubic-bezier(.2,.9,.3,1.2)}
.sheet h3{font-size:1.5rem;margin-bottom:6px}
.sheet p{color:var(--ink2);margin:0 0 18px;line-height:1.5}
.sheet .tag{display:inline-block;font-weight:800;font-size:.9rem;color:var(--uc,var(--pri));margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.chip{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:12px;padding:6px 10px;font-weight:700}
.chip span{font-size:1.25rem}
.sheet-m{width:110px;margin:0 auto 8px}

/* lesson */
.lesson{height:100%;display:flex;flex-direction:column;max-width:680px;margin:0 auto}
.lhead{display:flex;align-items:center;gap:14px;padding:16px 18px 6px}
.x{background:none;border:0;color:var(--ink3);cursor:pointer;padding:4px;display:grid;border-radius:8px}
.x svg{width:26px;height:26px}
.bar{flex:1;height:16px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{position:relative;display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .45s cubic-bezier(.3,1.3,.5,1);min-width:16px}
.bar i::after{content:"";position:absolute;top:3px;left:8px;right:8px;height:4px;border-radius:9px;background:rgba(255,255,255,.35)}
.combo{text-align:center;font-family:var(--disp);font-weight:800;color:var(--orange);font-size:1rem;height:22px}
.lbody{flex:1;overflow-y:auto;padding:6px 20px 24px;display:flex;flex-direction:column}
.lbody.locked{pointer-events:none}
.ltitle{font-size:1.65rem;margin:8px 0 20px}
.newtag{align-self:flex-start;color:#8B5CF6;font-weight:800;font-size:.95rem;display:flex;gap:6px;align-items:center}
.lfoot{border-top:2px solid var(--line);padding:16px 20px;transition:background .2s}
.lfoot.ok{background:var(--pri-l);border-color:transparent}
.lfoot.bad{background:var(--red-l);border-color:transparent}
.lfoot.ok .btn,.lfoot.bad .btn{animation:pop .25s}
.fb{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.fbi{width:52px;height:52px;flex:none;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.fbi svg{width:30px;height:30px}
.ok .fbi{color:var(--pri)} .bad .fbi{color:var(--red)}
.fb h3{font-size:1.4rem}
.ok .fb h3,.ok .fb p{color:var(--ok-ink)} .bad .fb h3,.bad .fb p{color:var(--bad-ink)}
.fb p{margin:2px 0 0;font-weight:700;font-size:1.05rem}
.fb .spk-mini{margin-left:auto}
.lfoot .row{display:flex;gap:12px}
.lfoot .row .btn{margin:0}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{position:relative;background:var(--bg);border:2px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--line);padding:18px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;font-weight:800;font-size:1.1rem;transition:transform .06s}
.card .em{font-size:3.4rem;line-height:1}
.card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
kbd{font-family:var(--body);font-size:.8rem;font-weight:800;color:var(--ink3);border:2px solid var(--line);border-radius:8px;min-width:26px;height:26px;display:inline-grid;place-items:center}
.card kbd{position:absolute;top:8px;left:8px}
.card.sel,.opt.sel{border-color:var(--blue);background:var(--blue-l);box-shadow:0 4px 0 var(--blue);color:var(--blue-d)}
.card.sel kbd,.opt.sel kbd{border-color:var(--blue);color:var(--blue)}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--line);padding:14px 16px;cursor:pointer;font-weight:700;font-size:1.1rem}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opts.row{flex-direction:row;flex-wrap:wrap;justify-content:center}
.opts.row .opt{padding:10px 16px}

.say{display:flex;align-items:flex-end;gap:10px;margin-bottom:22px}
.say .m{width:86px;flex:none}
.speech{position:relative;border:2px solid var(--line);border-radius:18px;padding:12px 16px;font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:10px;margin-bottom:18px}
.speech::before{content:"";position:absolute;left:-9px;bottom:16px;width:14px;height:14px;background:var(--bg);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.spk-mini{flex:none;width:40px;height:40px;border-radius:12px;border:0;background:var(--blue);color:#fff;box-shadow:0 3px 0 var(--blue-d);display:grid;place-items:center;cursor:pointer}
.spk-mini svg{width:22px;height:22px}
.spk-mini:active{transform:translateY(3px);box-shadow:none}
.listen{display:flex;justify-content:center;align-items:flex-end;gap:16px;margin:4px 0 26px}
.spk-big{width:116px;height:96px;border-radius:22px;border:0;background:var(--blue);color:#fff;box-shadow:0 6px 0 var(--blue-d);display:grid;place-items:center;cursor:pointer}
.spk-big svg{width:52px;height:52px}
.spk-slow{width:72px;height:64px;border-radius:18px;border:0;background:var(--blue);color:#fff;box-shadow:0 5px 0 var(--blue-d);font-size:30px;cursor:pointer}
.spk-big:active,.spk-slow:active{transform:translateY(5px);box-shadow:none}

.ans{display:flex;flex-wrap:wrap;align-content:flex-start;gap:10px 8px;min-height:114px;padding:4px 0 0;background:repeating-linear-gradient(to bottom,transparent 0 54px,var(--line) 54px 56px)}
.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 8px;margin-top:28px}
.tile{height:46px;padding:0 14px;border:2px solid var(--line);border-radius:12px;background:var(--bg);box-shadow:0 3px 0 var(--line);font-weight:700;font-size:1.1rem;cursor:pointer;animation:pop .15s}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.tile.ghost{background:var(--line);border-color:var(--line);box-shadow:none;color:transparent;pointer-events:none;animation:none}

.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol{display:flex;flex-direction:column;gap:12px}
.mbtn{min-height:58px;padding:8px 10px;border:2px solid var(--line);border-radius:14px;background:var(--bg);box-shadow:0 4px 0 var(--line);font-weight:700;font-size:1.05rem;cursor:pointer;transition:opacity .3s}
.mbtn.sel{border-color:var(--blue);background:var(--blue-l);box-shadow:0 4px 0 var(--blue);color:var(--blue-d)}
.mbtn.ok{border-color:var(--pri);background:var(--pri-l);color:var(--ok-ink);box-shadow:0 4px 0 var(--pri)}
.mbtn.ok:disabled{opacity:.35;cursor:default}
.mbtn.bad{border-color:var(--red);background:var(--red-l);color:var(--bad-ink);box-shadow:0 4px 0 var(--red);animation:shake .35s}

.blank-s{font-size:1.4rem;font-weight:700;line-height:2.1;margin-bottom:6px}
.gap{display:inline-block;min-width:96px;border-bottom:3px solid var(--ink3);text-align:center;color:var(--blue);margin:0 4px;line-height:1.4}
.hint{color:var(--ink2);margin:0 0 22px;font-size:1.05rem}
.mic{display:flex;flex-direction:column;align-items:center;gap:10px;margin:10px auto;width:100%;max-width:340px;padding:22px;border:2px solid var(--line);border-radius:20px;background:var(--bg);box-shadow:0 4px 0 var(--line);color:var(--blue);font-weight:800;cursor:pointer}
.mic svg{width:40px;height:40px}
.mic.rec{border-color:var(--red);color:var(--red);animation:pulse 1s ease-in-out infinite}

/* result & welcome */
.result,.welcome{height:100%;display:flex;flex-direction:column;max-width:600px;margin:0 auto}
.rbody{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 20px}
.rmascot{width:160px;margin-bottom:8px;animation:bob 2s ease-in-out infinite}
.rtitle{font-size:2rem;color:var(--gold-d);margin-bottom:24px}
.stats3{display:flex;gap:10px;width:100%;max-width:440px}
.st{flex:1;border:2px solid var(--c);border-radius:16px;overflow:hidden;background:var(--c)}
.st b{display:block;color:#fff;font-size:.85rem;font-weight:800;padding:5px 2px}
.st span{display:flex;gap:6px;justify-content:center;align-items:center;padding:12px 4px;background:var(--bg);border-radius:13px;font-family:var(--disp);font-weight:800;font-size:1.35rem;color:var(--c)}
.st svg{width:22px;height:22px}
.note{margin-top:14px;font-weight:800;padding:10px 16px;border-radius:14px;background:var(--bg2)}
.rfoot{padding:16px 20px;border-top:2px solid var(--line)}
.bigflame{width:150px;animation:pop .5s}
.bignum{font-family:var(--disp);font-size:5rem;font-weight:800;color:var(--orange);line-height:1}
.brand{font-size:3.6rem;color:var(--pri);letter-spacing:-.01em;line-height:1}
.lead{font-size:1.15rem;color:var(--ink2);max-width:340px;margin:10px auto 0;line-height:1.5}
.w-mascot{width:170px;margin:0 auto 6px;animation:bob 2s ease-in-out infinite}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.goal{border:2px solid var(--line);border-radius:16px;background:var(--bg);box-shadow:0 4px 0 var(--line);padding:12px;cursor:pointer;text-align:left}
.goal b{display:block;font-family:var(--disp);font-size:1.15rem}
.goal span{color:var(--ink2);font-size:.9rem}
.goal.sel{border-color:var(--blue);background:var(--blue-l);box-shadow:0 4px 0 var(--blue)}
.goal.sel b{color:var(--blue-d)}

/* practice / profile */
.sec{padding:20px 16px 0}
.sec > h2{font-size:1.4rem;margin-bottom:12px}
.pcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:2px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--line);background:var(--bg);padding:14px 16px;cursor:pointer;margin-bottom:12px}
.pcard:disabled{opacity:.5;cursor:default}
.pcard .pi{width:52px;height:52px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:28px;background:var(--bg2)}
.pcard h3{font-size:1.15rem}
.pcard p{margin:2px 0 0;color:var(--ink2);font-size:.95rem}
.pcard .go{margin-left:auto;color:var(--ink3);font-family:var(--disp);font-weight:800;font-size:1.4rem}
.wlist{border:2px solid var(--line);border-radius:18px;overflow:hidden}
.wrow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:2px solid var(--line)}
.wrow:last-child{border-bottom:0}
.wrow .e{font-size:1.7rem;width:36px;text-align:center}
.wrow b{display:block;font-size:1.05rem}
.wrow small{color:var(--ink2);font-size:.92rem}
.str{margin-left:auto;display:flex;gap:3px;align-items:flex-end}
.str i{width:6px;border-radius:3px;background:var(--line)}
.str i.on{background:var(--pri)}
.wrow .spk-mini{width:36px;height:36px}
.empty{text-align:center;padding:26px 16px;border:2px dashed var(--line);border-radius:18px;color:var(--ink2)}
.empty .m{width:100px;margin:0 auto 8px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sbox{border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center}
.sbox svg{width:30px;height:30px;flex:none}
.sbox .em{font-size:1.6rem}
.sbox b{display:block;font-family:var(--disp);font-size:1.35rem;line-height:1.1}
.sbox small{color:var(--ink2);font-size:.88rem}
.week{display:flex;justify-content:space-between;border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.85rem;color:var(--ink2);font-weight:800}
.day i{width:32px;height:32px;border-radius:50%;background:var(--line);display:grid;place-items:center;color:#fff}
.day i svg{width:18px;height:18px}
.day.on i{background:var(--orange)}
.day.today{color:var(--ink)}
.ach{display:flex;gap:14px;align-items:center;padding:12px 14px;border-bottom:2px solid var(--line)}
.ach:last-child{border-bottom:0}
.ach .badge{width:54px;height:54px;flex:none;border-radius:16px;display:grid;place-items:center;font-size:28px;background:var(--bg2);filter:grayscale(1);opacity:.6}
.ach.got .badge{background:#FFF1C7;filter:none;opacity:1;box-shadow:0 3px 0 var(--gold)}
.ach h3{font-size:1.08rem}
.ach p{margin:0;color:var(--ink2);font-size:.92rem}
.ach .pbar{height:10px}
.ach .info{flex:1}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border-bottom:2px solid var(--line)}
.set:last-child{border-bottom:0}
.set p{margin:2px 0 0;color:var(--ink2);font-size:.9rem;font-weight:600}
.sw{flex:none;width:54px;height:32px;border-radius:99px;border:0;background:var(--line);position:relative;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw[aria-checked="true"]{background:var(--pri)}
.sw[aria-checked="true"]::after{transform:translateX(22px)}
.seg{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;flex:none}
.seg button{border:0;background:none;padding:7px 10px;font-weight:800;font-size:.88rem;cursor:pointer;color:var(--ink2)}
.seg button.on{background:var(--blue-l);color:var(--blue-d)}
.box{border:2px solid var(--line);border-radius:18px;overflow:hidden}
.danger{color:var(--red)!important;border-color:var(--line)!important}


/* v2 */
.lvchip{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-weight:800;font-size:1.05rem;border:2px solid var(--line);border-radius:12px;padding:4px 10px 4px 5px}
.lvchip .flag{width:30px;height:21px;border-radius:5px;box-shadow:none}
.lvchip .flag svg{width:30px;height:21px}
.lvtabs{display:flex;gap:8px;padding:16px 16px 0}
.lvt{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:9px 0 8px;border:2px solid var(--line);border-radius:14px;background:var(--bg);box-shadow:0 3px 0 var(--line);font-family:var(--disp);font-weight:800;font-size:1.1rem;color:var(--ink2);cursor:pointer}
.lvt svg{width:15px;height:15px}
.lvt.on{background:var(--lc);border-color:var(--lc);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--lc) 70%,#000)}
.lvcard{position:relative;overflow:hidden;margin:14px 16px 0;padding:18px 18px 18px;border-radius:24px;background:var(--lc);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--lc) 70%,#000)}
.lvcard::after{content:attr(data-code);position:absolute;right:-8px;bottom:-40px;font-family:var(--disp);font-weight:800;font-size:9.5rem;line-height:1;letter-spacing:-.04em;opacity:.16;pointer-events:none}
.lvcard small{font-weight:800;opacity:.85}
.lvcard h2{font-size:1.9rem;margin:2px 0 4px;letter-spacing:-.01em}
.lvcard p{margin:0;opacity:.92;max-width:75%;line-height:1.45}
.lvprog{display:flex;align-items:center;gap:10px;margin-top:14px;max-width:75%;position:relative;z-index:1}
.lvprog .pbar{flex:1;margin:0;background:rgba(255,255,255,.28)}
.lvprog .pbar i{background:#fff}
.lvprog span{font-weight:800;font-size:.9rem;white-space:nowrap}
.lvlock{display:flex;gap:6px;align-items:center;margin-top:12px!important;font-weight:700;font-size:.92rem}
.lvlock svg{width:16px;height:16px;flex:none}
.lvskip{position:relative;z-index:1;margin-top:14px;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.55);color:#fff;border-radius:12px;padding:8px 14px;font-weight:800;cursor:pointer}
.lvskip:hover{background:rgba(255,255,255,.28)}
.ug{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.35);border-radius:14px;padding:8px 10px 6px;color:#fff;cursor:pointer;font-weight:800;font-size:.78rem}
.ug svg{width:24px;height:24px}
.unit.dim .ug{color:var(--ink2);border-color:var(--line-d);background:transparent}
.node.open{background:var(--uc);box-shadow:0 7px 0 var(--ud)}
.ti{width:100%;min-height:118px;border:2px solid var(--line);border-radius:16px;background:var(--bg2);padding:14px 16px;font:inherit;font-weight:600;font-size:1.15rem;color:var(--ink);resize:none;line-height:1.5}
.ti:focus{outline:none;border-color:var(--blue);background:var(--bg)}
.ti[readonly]{opacity:.8}
.small{color:var(--ink2);font-size:.88rem;margin:8px 2px 0;font-weight:600}
.fb .sm{font-weight:600;font-size:.92rem;opacity:.85}
.tlabel{color:#fff;font-family:var(--disp);font-weight:800;border-radius:10px;padding:3px 10px}
.gb{color:var(--ink)!important;font-size:1.02rem}
.gx{border:2px solid var(--line);border-radius:16px;margin-bottom:18px}
.gxr{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:2px solid var(--line)}
.gxr:last-child{border-bottom:0}
.gxr div{flex:1}.gxr b{display:block}.gxr small{color:var(--ink2)}
.gxr .spk-mini{width:36px;height:36px}
.sheet{max-height:88vh;overflow-y:auto}
.lvb{display:inline-grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:.85rem!important;color:#fff;background:var(--ink3);border-radius:9px;height:30px;width:36px}
.lvb.big{width:40px;height:40px;font-size:1rem!important;border-radius:12px;flex:none}
.lvstrip{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.lvstrip span{display:flex;gap:6px;align-items:center;border:2px solid var(--line);border-radius:99px;padding:4px 12px 4px 4px;font-size:.88rem;font-weight:700;color:var(--ink2)}
.lvstrip b{background:var(--lc);color:#fff;border-radius:99px;padding:2px 8px;font-family:var(--disp)}
.row2{display:flex;gap:12px}.row2 .btn{margin:0}
.opt span{line-height:1.35}
@media (max-width:380px){.lvcard p,.lvprog{max-width:100%}.row2{flex-direction:column-reverse}}
/* v3: profiller, görevler, albüm */
button.lvchip{background:var(--bg);color:var(--ink);cursor:pointer}
.pav-s{font-size:1.35rem;line-height:1}
.quests,.league{margin:16px 16px 0;border:2px solid var(--line);border-radius:20px;padding:14px 16px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.qhead h3{font-size:1.15rem}
.qrow{display:flex;align-items:center;gap:12px;padding:7px 0}
.qi{width:36px;height:36px;border-radius:10px;background:var(--bg2);display:grid;place-items:center;font-size:1.15rem;flex:none}
.qt{flex:1;min-width:0}.qt b{font-size:.95rem}.qt .pbar{height:10px;margin-top:5px}
.qrow small{font-weight:800;color:var(--ink2);min-width:44px;text-align:right}
.qrow.ok .pbar i{background:var(--pri)}.qrow.ok .qi{background:var(--pri-l)}
.qbox{display:flex;align-items:center;gap:6px;font-weight:800;font-size:.88rem;color:var(--ink2);border:0;background:none;padding:0;text-align:right}
.qbox svg{width:40px;height:40px;flex:none}
.qbox:not(.ready):not(.opened) svg{filter:grayscale(.7);opacity:.6}
.qbox.opened svg{opacity:.45}
.qbox.ready{background:#8B5CF6;color:#fff;border-radius:14px;padding:4px 14px 4px 6px;box-shadow:0 4px 0 #6D3FD9;cursor:pointer;font-family:var(--disp);font-size:1rem;animation:pulse 1.1s ease-in-out infinite}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px}
.lrow.me{background:var(--blue-l)}
.rk{width:24px;text-align:center;font-weight:800;color:var(--ink2)}
.lrow .av{font-size:1.5rem}
.lrow b{flex:1}
.lx{font-family:var(--disp);font-weight:800;color:var(--gold-d)}
.bigav{width:72px;height:72px;flex:none;border-radius:22px;background:var(--bg2);display:grid;place-items:center;font-size:2.8rem}
.plist{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;width:100%;max-width:420px}
.ptile{border:2px solid var(--line);border-radius:22px;background:var(--bg);box-shadow:0 5px 0 var(--line);padding:18px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}

.pav{font-size:3.4rem;line-height:1.15}
.ptile b{font-family:var(--disp);font-size:1.25rem}
.ptile small{color:var(--ink2);font-weight:700;font-size:.85rem}
.ptile.add .pav{width:64px;height:64px;margin:3px 0;border-radius:50%;border:3px dashed var(--line-d);display:grid;place-items:center;font-size:2rem;color:var(--ink3)}
.lbl{display:block;font-weight:800;margin:14px 0 6px}
.inp{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;font-size:1.1rem;background:var(--bg2);color:var(--ink)}
.inp:focus{outline:none;border-color:var(--blue);background:var(--bg)}
.avs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.avb{font-size:1.8rem;border:2px solid var(--line);border-radius:14px;background:var(--bg);padding:6px 0;cursor:pointer}
.avb.sel{border-color:var(--blue);background:var(--blue-l)}
.albhead{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-family:var(--disp)}
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (min-width:520px){.album{grid-template-columns:repeat(4,1fr)}}
.r-com{--rc:var(--line-d)}.r-rare{--rc:#8B5CF6}.r-leg{--rc:#E3A008}
.acard{border:2px solid var(--rc);border-radius:16px;padding:12px 6px 10px;background:var(--bg);box-shadow:0 4px 0 var(--rc);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center;color:var(--ink)}
.acard.r-leg{background:color-mix(in srgb,#FFC83D 16%,var(--bg))}
.acard.r-rare{background:color-mix(in srgb,#8B5CF6 8%,var(--bg))}
.acard b{font-size:.85rem;line-height:1.2}.acard small{font-size:.75rem;color:var(--ink2);font-weight:700}
.acard.locked{cursor:default}
.acard .q{width:64px;height:64px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:2rem;color:var(--ink3)}
.planet{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--a),var(--b));box-shadow:inset -8px -8px 16px rgba(0,0,0,.25);position:relative;margin:0 auto;flex:none}
.planet.big{width:130px;height:130px}
.planet.sun{box-shadow:0 0 22px 6px rgba(255,170,0,.5)}
.planet.spots{background:radial-gradient(circle at 60% 42%,#6b3a00 0 6%,transparent 7%),radial-gradient(circle at 42% 64%,#6b3a00 0 4%,transparent 5%),radial-gradient(circle at 66% 66%,#6b3a00 0 3%,transparent 4%),radial-gradient(circle at 35% 30%,var(--a),var(--b))}
.planet.stripes{background:repeating-linear-gradient(170deg,rgba(150,90,50,.35) 0 9%,transparent 9% 18%),radial-gradient(circle at 35% 30%,var(--a),var(--b))}
.planet.ring::after{content:"";position:absolute;left:-28%;top:38%;width:156%;height:24%;border:4px solid #E2C88E;border-radius:50%;transform:rotate(-16deg)}
.planet.eclipse{background:#111;box-shadow:0 0 0 3px #FFB347,0 0 26px 8px rgba(255,180,70,.75)}
.planet.bh{background:radial-gradient(circle,#000 0 42%,#FF8A00 48%,#7a2a00 60%,rgba(0,0,0,0) 70%);box-shadow:none}
.planet.aurora{border-radius:18px;background:linear-gradient(165deg,#0b1d3a 8%,#21d4a0 40%,#8b5cf6 72%,#0b1d3a 98%);box-shadow:none}
.cem{font-size:46px;line-height:64px;height:64px;text-align:center}
.cem.big{font-size:100px;line-height:130px;height:130px}
.bigbox{border:0;background:none;width:210px;height:210px;cursor:pointer;margin:10px auto 0;animation:bob 1.6s ease-in-out infinite;border-radius:30px}
.bigbox svg{width:100%;height:100%;filter:drop-shadow(0 12px 14px rgba(0,0,0,.2))}
.bigbox.shake{animation:boxshake .42s}
@keyframes boxshake{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-12deg) scale(1.08)}75%{transform:rotate(12deg) scale(1.08)}}
.tapme{font-weight:800;color:var(--ink2);font-size:1.15rem;min-height:1.6em}
.rcard{width:min(320px,88vw);border:3px solid var(--rc,var(--line-d));border-radius:26px;padding:22px 18px;box-shadow:0 6px 0 var(--rc,var(--line-d));background:var(--bg);text-align:center}
.rcard.r-leg{box-shadow:0 6px 0 var(--rc),0 0 44px rgba(255,200,61,.65)}
.rcard.r-rare{box-shadow:0 6px 0 var(--rc),0 0 30px rgba(139,92,246,.4)}
.reveal{animation:flipin .75s cubic-bezier(.2,.9,.3,1.3)}
@keyframes flipin{from{transform:perspective(600px) rotateY(100deg) scale(.6);opacity:0}}
.rar{display:inline-block;color:#fff;background:var(--rc,var(--ink3));border-radius:99px;padding:3px 12px;font-weight:800;font-size:.85rem;margin-bottom:14px}
.rar.r-com,.r-com .rar{background:var(--ink3)}
.enname{display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--disp);font-weight:700;font-size:1.25rem;color:var(--blue-d);margin:4px 0 8px}
.enname .spk-mini{width:34px;height:34px}
.fact{color:var(--ink2);line-height:1.5;margin:6px 0 0;font-weight:600}
.boxnote{background:#8B5CF6!important;color:#fff}

#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-8deg)}90%{transform:rotate(8deg)}95%{transform:rotate(-4deg)}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulse{50%{transform:scale(1.03)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (min-width:640px){.ltitle{font-size:1.9rem}.card .em{font-size:4rem}}

const lvLessons=lv=>LESSONS.filter(l=>l.lv===lv);
const lvDone=lv=>lvLessons(lv).every(l=>S.done[l.id]);
const lvAccess=lv=>lv===0||lv<=S.levelUnlocked||lvDone(lv-1);
function isOpen(l){
  if(!lvAccess(l.lv))return false;
  if(l.lv<S.levelUnlocked)return true;
  const ls=lvLessons(l.lv);const i=ls.findIndex(x=>x.id===l.id);
  return i===0||!!S.done[ls[i-1].id];
}
function currentId(){for(let lv=LEVELS.length-1;lv>=0;lv--){if(!lvAccess(lv))continue;const l=lvLessons(lv).find(x=>!S.done[x.id]&&isOpen(x));if(l)return l.id}return null}

function checkStreak(){
  if(!S.lastActive||S.lastActive===today()||S.lastActive===yesterday())return;
  const gap=Math.round((new Date(today())-new Date(S.lastActive))/864e5)-1;
  if(S.streak>0&&S.freeze>=gap){S.freeze-=gap;S.lastActive=yesterday();S.shieldUsed=gap}else S.streak=0;
}

function sfx(k,x){

    const T=(f,s,d,ty='triangle',v=.14)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,n+s);g.gain.linearRampToValueAtTime(v,n+s+.012);g.gain.exponentialRampToValueAtTime(.001,n+s+d);o.connect(g).connect(AC.destination);o.start(n+s);o.stop(n+s+d+.03)};
    if(k==='ok'){T(784,0,.16);T(1175,.09,.28)}
    else if(k==='bad'){T(233,0,.22,'square',.06);T(196,.12,.3,'square',.06)}
    else if(k==='tap'){T(660,0,.05,'sine',.05)}
    else if(k==='match'){T(988,0,.12,'sine',.08)}
    else if(k==='tick'){T(520+(x||0)*170,0,.14,'sine',.12)}
    else if(k==='legend'){[523,659,784,1047,1319,1568,2093].forEach((f,i)=>T(f,i*.07,.4))}

}

const CONTR=[["i'm","i am"],["you're","you are"],["we're","we are"],["they're","they are"],["he's","he is"],["she's","she is"],["it's","it is"],["that's","that is"],["what's","what is"],["where's","where is"],["don't","do not"],["doesn't","does not"],["didn't","did not"],["can't","cannot"],["can not","cannot"],["couldn't","could not"],["won't","will not"],["wouldn't","would not"],["shouldn't","should not"],["isn't","is not"],["aren't","are not"],["wasn't","was not"],["weren't","were not"],["haven't","have not"],["hasn't","has not"],["i've","i have"],["we've","we have"],["they've","they have"],["i'll","i will"],["we'll","we will"],["i'd","i would"],["let's","let us"],["dont","do not"],["doesnt","does not"],["didnt","did not"],["cant","cannot"],["wont","will not"],["isnt","is not"],["arent","are not"],["wasnt","was not"],["werent","were not"],["couldnt","could not"],["shouldnt","should not"],["wouldnt","would not"],["havent","have not"],["hasnt","has not"],["im","i am"],["ive","i have"]];
function expand(s){let t=norm(s.replace(/[’‘`]/g,"'"),'en');for(const[a,b]of CONTR)t=t.replace(new RegExp('(^| )'+a+'(?= |$)','g'),'$1'+b);return t}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function fuzzy(got,ans,extra={}){
  const a=expand(got),b=expand(ans);
  if(a===b)return{ok:true,sol:ans,speak:ans,...extra};
  if(lev(a,b)<=Math.max(1,Math.floor(b.length/18)))return{ok:true,sol:ans,speak:ans,...extra,note:`Küçük bir yazım hatası var. Doğrusu: ${ans}`};
  return{ok:false,sol:ans,speak:ans,canOverride:true,...extra};
}

/* ---------- alıştırma üreticileri ---------- */
const lvPool=w=>LV_WORDS[WORD_LV[w]]||VOCAB;
function exPick(en,pool){const same=(pool||lvPool(en)).filter(x=>x!==en);return{t:'pick',en,opts:shuffle([en,...pick(same,3)]),key:'w:'+en}}
function exMatch(ens){return{t:'match',pairs:ens.slice(0,5),key:null}}
function tileBank(ansToks,lang,unitSents,srcIdx){
  const low=new Set(ansToks.map(t=>lc(t,lang)));const seen=new Set();const pool=[];
  unitSents.flatMap(x=>tokenize(x[srcIdx])).forEach(t=>{const k=lc(t,lang);if(!low.has(k)&&!seen.has(k)){seen.add(k);pool.push(t)}});
  const n=Math.min(4,Math.max(2,8-ansToks.length));
  return shuffle([...ansToks,...pick(pool,n)]);
}
function exTiles(s,dir,us){
  const toEn=dir==='tr2en';const ans=toEn?s[0]:s[1];
  return{t:'tiles',dir,src:toEn?s[1]:s[0],ans,bank:tileBank(tokenize(ans),toEn?'en':'tr',us,toEn?0:1),key:'s:'+s[0]};
}
function exListen(s,us,typed){
  if(!HAS_TTS)return typed?exType(s):exTiles(s,'tr2en',us);
  if(typed)return{t:'listen',typed:true,ans:s[0],tr:s[1],key:'s:'+s[0]};
  return{t:'listen',dir:'tr2en',ans:s[0],tr:s[1],bank:tileBank(tokenize(s[0]),'en',us,0),key:'s:'+s[0]};
}
function exType(s){return{t:'type',src:s[1],ans:s[0],key:'s:'+s[0]}}
const NAMES=/^[A-ZÇĞİÖŞÜ]/;
function exChoice(s,us){
  const toks=s[0].replace(/[.!?]$/,'').split(' ');const endP=(s[0].match(/[.!?]$/)||[''])[0];
  const others=us.filter(x=>x[0]!==s[0]);
  const lowSet=new Set(tokenize(s[0]).map(t=>t.toLowerCase()));
  const rep=[...new Set(others.flatMap(x=>tokenize(x[0])))].filter(t=>t===t.toLowerCase()&&!lowSet.has(t)&&t.length>2&&!/\d/.test(t));
  let va=null;
  for(let k=0;k<25&&rep.length;k++){
    const i=Math.random()*toks.length|0;const clean=toks[i].replace(/[,;]/g,'');
    if(clean.length<3||/\d/.test(clean)||(i>0&&NAMES.test(clean)))continue;
    const r=rep[Math.random()*rep.length|0];
    const t2=toks.slice();t2[i]=toks[i].replace(clean,r);let str=t2.join(' ');str=str.charAt(0).toUpperCase()+str.slice(1)+endP;
    if(str!==s[0]){va=str;break}
  }
  const wrong=pick(others,2).map(x=>x[0]);
  const opts=[s[0],va||wrong[1],wrong[0]].filter(Boolean);
  return{t:'choice',tr:s[1],ans:s[0],opts:shuffle([...new Set(opts)]),key:'s:'+s[0]};
}
function exBlank(s,ws,lv){
  const toks=s[0].split(' ');const clean=t=>t.replace(/[.,!?;]/g,'').toLowerCase();
  let idx=toks.findIndex(t=>ws.includes(clean(t)));
  if(idx<0)idx=toks.map((t,i)=>[clean(t).length,i]).sort((a,b)=>b[0]-a[0])[0][1];
  const ans=clean(toks[idx]);const punct=toks[idx].replace(/[^.,!?;]/g,'');
  let singles=(LV_WORDS[lv]||VOCAB).filter(w=>!w.includes(' ')&&w!==ans);
  if(singles.length<3)singles=VOCAB.filter(w=>!w.includes(' ')&&w!==ans);
  return{t:'blank',before:toks.slice(0,idx).join(' '),punct,after:toks.slice(idx+1).join(' '),ans,full:s[0],tr:s[1],opts:shuffle([ans,...pick(singles,3)]),key:'s:'+s[0]};
}
function exSpeak(s){return{t:'speak',en:s[0],tr:s[1],key:null}}

function buildLesson(l){
  const us=UNIT_SENTS[l.sents[0][0]];const ws=l.words,ss=l.sents;
  const pool=[...new Set([...l.u.lessons.flatMap(x=>x.words),...pick(LV_WORDS[l.lv],6)])];
  const prev=learned().filter(w=>!ws.includes(w)&&WORD_LV[w]===l.lv);
  const mp=[...ws.slice(0,4),...(prev.length?pick(prev,1):ws.slice(4,5))];
  const P=i=>exPick(ws[i],pool);const kid=isKid();const TY=x=>kid?exTiles(x,'tr2en',us):exType(x);
  let ex;
  if(l.lv===0)ex=[P(0),P(1),exTiles(ss[0],'tr2en',us),P(2),exListen(ss[1],us),P(3),exBlank(ss[2],ws,l.lv),exMatch(mp),exChoice(ss[3],us),exTiles(ss[0],'en2tr',us)];
  else if(l.lv===1)ex=[P(0),P(1),exTiles(ss[0],'tr2en',us),P(2),exListen(ss[1],us),P(3),exBlank(ss[2],ws,l.lv),exMatch(mp),exChoice(ss[3],us),TY(ss[1]),exTiles(ss[0],'en2tr',us)];
  else ex=[P(0),P(1),exTiles(ss[0],'tr2en',us),P(2),exBlank(ss[2],ws,l.lv),exListen(ss[1],us,!kid),P(3),exMatch(mp),exChoice(ss[3],us),TY(ss[2]),exTiles(ss[3],'en2tr',us)];
  if(SR&&S.speakOn)ex.push(exSpeak(ss[1]));
  return ex;
}
function buildPractice(mode){
  const ws=learned();const sents=LESSONS.filter(l=>S.done[l.id]).flatMap(l=>l.sents);
  let ex=[];
  if(mode==='mistakes'){
    S.mistakes.slice(-10).forEach(k=>{
      if(k.startsWith('w:')){const en=k.slice(2);if(W[en])ex.push(exPick(en))}
      else{const s=ALL_SENTS.find(x=>x[0]===k.slice(2));if(s){const us=UNIT_SENTS[s[0]];const r=Math.random();ex.push(SENT_LV[s[0]]>=1&&r<.33&&!isKid()?exType(s):r<.66?exTiles(s,'tr2en',us):exChoice(s,us))}}
    });
    ex=shuffle(ex);
  }else if(mode==='words'){
    const weak=shuffle(ws).sort((a,b)=>strength(a)-strength(b)).slice(0,8);
    weak.slice(0,5).forEach(w=>ex.push(exPick(w)));
    if(weak.length>=4)ex.splice(2,0,exMatch(weak.slice(0,5)));
    pick(sents,2).forEach(s=>ex.push(exBlank(s,ws,SENT_LV[s[0]])));
  }else if(mode==='listen'){
    pick(sents,5).forEach(s=>ex.push(exListen(s,UNIT_SENTS[s[0]],SENT_LV[s[0]]>=2&&!isKid())));
    pick(sents,2).forEach(s=>ex.push(exTiles(s,'en2tr',UNIT_SENTS[s[0]])));
  }else if(mode==='writing'){
    pick(sents,6).forEach(s=>ex.push(exType(s)));
  }
  return ex;
}
function buildStage(lv,n){
  const sents=shuffle(lvLessons(lv).flatMap(l=>l.sents)).slice(0,n);const words=shuffle(LV_WORDS[lv]);
  const kinds=shuffle(['choice','blank','tiles','pick','choice','blank','tiles','pick']);
  return sents.map((s,i)=>{const k=kinds[i%kinds.length],us=UNIT_SENTS[s[0]];
    if(k==='choice')return exChoice(s,us);if(k==='blank')return exBlank(s,LV_WORDS[lv],lv);if(k==='tiles')return exTiles(s,'tr2en',us);return exPick(words[i%words.length],LV_WORDS[lv])});
}

  $('#lbody').classList.add('locked');$$('#lbody textarea').forEach(t=>t.readOnly=true);
  const lw={requeued:false,heart:false,key:ex.key,added:false};
  if(r.ok){L.correct++;L.combo++;sfx('ok');if(L.mode==='test')L.stageCorrect++;{const q=questDay();q.c.correct++;q.c.combo=Math.max(q.c.combo,L.combo);if(ex.t==='listen')q.c.listen++;if(ex.t==='match')q.c.match++}if(r.speak&&!['pick','speak','listen'].includes(ex.t))say(r.speak)}

    if(L.mode!=='test'){L.queue.push({...ex,opts:ex.opts?shuffle(ex.opts):undefined,bank:ex.bank?shuffle(ex.bank):undefined});lw.requeued=true}
    if(L.mode==='lesson'&&S.heartsOn){if(S.hearts>=5)S.heartTs=Date.now();if(S.hearts>0){S.hearts--;lw.heart=true}}
  }
  lw.added=track(ex,r.ok);L.lastWrong=r.ok?null:lw;save();refreshHead();feedback(r);

  const secs=Math.round((Date.now()-L.start)/1000);
  const acc=Math.round(L.correct/Math.max(1,L.correct+L.wrong)*100);
  app.innerHTML=`<div class="result"><div class="rbody"><div class="rmascot">${mascot(o.mood||'cheer')}</div>
  <h1 class="rtitle" style="${o.mood==='sad'?'color:var(--ink2)':''}">${esc(o.title)}</h1>${o.msg?`<p class="lead" style="margin:-10px auto 22px">${esc(o.msg)}</p>`:''}
  <div class="stats3"><div class="st" style="--c:var(--gold-d)"><b>Toplam XP</b><span>${I.bolt}${o.xp}</span></div>
  <div class="st" style="--c:var(--pri)"><b>${acc>=90?'Çok isabetli':'İsabet'}</b><span>${I.target}%${acc}</span></div>
  <div class="st" style="--c:var(--blue)"><b>Süre</b><span>${I.clock}${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}</span></div></div>
  ${o.goalHit?`<div class="note">🎉 Günlük hedefini tamamladın</div>`:''}
  ${o.heart?`<div class="note" style="color:var(--red)">+1 can kazandın</div>`:''}
  ${(o.quests||[]).map(t=>`<div class="note">🎯 Görev tamamlandı: ${esc(t)}</div>`).join('')}
  ${o.boxReady?`<div class="note boxnote">🎁 Sürpriz kutun hazır!</div>`:''}
  ${(o.newAch||[]).map(a=>`<div class="note">${a.e} Yeni başarı: ${a.t}</div>`).join('')}
  </div><footer class="rfoot"><button class="btn" data-act="afterResult">${esc(o.btn||'Devam et')}</button></footer></div>`;
  if(o.mood!=='sad'){sfx('win');confetti()}
  setTimeout(()=>{const b=$('.rfoot .btn');b&&b.focus()},80);
}
function finish(){
  const perfect=L.wrong===0;const xp=(L.mode==='lesson'?10:5)+(perfect?5:0);
  const aw=award(xp);let heart=false;
  if(L.mode==='lesson'){S.done[L.id]=(S.done[L.id]||0)+1;S.lessonsDone++;L.words.forEach(w=>{const o=S.words[w]||(S.words[w]={c:0,w:0});if(o.c<1)o.c=1});if(perfect)S.perfect++}
  else if(S.hearts<5){S.hearts++;heart=true}
  {const q=questDay();if(L.mode==='lesson'){q.c.lessons++;if(perfect)q.c.perfect++}else q.c.practice++}
  const newAch=newAchievements();save();viewLv=userLevel();
  showResult({title:perfect?'Kusursuz!':L.mode==='lesson'?'Ders tamamlandı!':'Pratik tamamlandı!',xp,heart,newAch,...questNotes(),...aw});
}
function finishTest(){
  let title,msg,mood='cheer';
  if(L.kind==='placement'){
    const nl=Math.min(LEVELS.length-1,L.passed);S.levelUnlocked=Math.max(S.levelUnlocked,nl);
    title=`Seviyen: ${LEVELS[nl].code}`;
    msg=nl===0?'Temelden başlamak en sağlam yol. A1 ile başlıyoruz.':`${LEVELS[nl].code} dersleri açıldı. Önceki seviyelerin tüm dersleri de tekrar için açık.`;
  }else{
    const st=L.stages[0];
    if(L.passed){S.levelUnlocked=Math.max(S.levelUnlocked,st.lv+1);title=`${LEVELS[st.lv+1].code} açıldı!`;msg=`${LEVELS[st.lv].code} sınavını geçtin. ${LEVELS[st.lv+1].code} derslerine başlayabilirsin.`}
    else{mood='sad';title='Bu sefer olmadı';msg=`${L.stageCorrect}/${st.n} doğru yaptın, geçmek için ${st.need} gerekiyor. Biraz pratikten sonra tekrar dene.`}
  }
  const xp=mood==='sad'?5:10;const aw=award(xp);const newAch=newAchievements();save();viewLv=userLevel();
  showResult({title,msg,mood,xp,newAch,...questNotes(),btn:mood==='sad'?'Tamam':'Öğrenmeye başla',...aw});
}

function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('#confetti'),ctx=c.getContext('2d'),dpr=window.devicePixelRatio||1,w=innerWidth,h=innerHeight;
  c.width=w*dpr;c.height=h*dpr;ctx.scale(dpr,dpr);
  const cols=['#12B5A6','#FFC83D','#FF8A3D','#7C5CF6','#2F8CF0','#F43F5E'];
  const P=Array.from({length:150},()=>({x:w/2+(Math.random()-.5)*120,y:h*.32,vx:(Math.random()-.5)*14,vy:-Math.random()*13-4,r:Math.random()*7+5,c:cols[Math.random()*6|0],a:Math.random()*6,va:(Math.random()-.5)*.3}));
  const t0=performance.now();
  (function f(t){ctx.clearRect(0,0,w,h);P.forEach(p=>{p.vy+=.33;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);ctx.restore()});if(t-t0<3000)requestAnimationFrame(f);else ctx.clearRect(0,0,w,h)})(t0);
}

function questCard(){
  const q=questDay();const all=qAll(q);const dn=q.ids.filter(id=>qDone(q,id)).length;
  const box=q.box?`<div class="qbox opened">${I.gift}<span>Yeni kutu ${untilMidnight()} sonra</span></div>`:all?`<button class="qbox ready" data-act="openbox">${I.gift}<span>Kutuyu aç!</span></button>`:`<div class="qbox" title="Görevleri bitirince açılır">${I.gift}<span>${dn}/3</span></div>`;
  return `<div class="quests"><div class="qhead"><h3>Günün görevleri</h3>${box}</div>${q.ids.map(id=>{const Q=qDef(id),n=Q.n(),v=Math.min(n,Q.v(q)),ok=v>=n;return `<div class="qrow ${ok?'ok':''}"><span class="qi">${ok?'✔️':Q.ic}</span><div class="qt"><b>${Q.t()}</b><div class="pbar"><i style="width:${v/n*100}%"></i></div></div><small>${v}/${n}</small></div>`}).join('')}${!q.box&&!all?`<p class="small" style="margin-top:6px">Üç görevi bitir, sürpriz kutuyu aç. İçinden bir uzay kartı çıkacak!</p>`:''}</div>`;

function openBox(){

  if(daily){const q=questDay();q.box=true;S.boxes++}else S.chests[BOX.uid]=true;

  let shield=false;
  if(card)S.cards[card.id]=today();

  app.innerHTML=`<div class="result"><div class="rbody">

  <p class="small" style="text-align:center;margin-top:14px">Albüm: ${own}/${CARDS.length} kart. ${daily?`Yeni görevler ve yeni bir kutu ${untilMidnight()} sonra.`:'Sıradaki ünitede yeni bir sandık seni bekliyor.'}</p>

 tapbox(b){if(!BOX||BOX.taps>=3)return;BOX.taps++;sfx('tick',BOX.taps);b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');const t=$('#tapme');if(t)t.textContent=['','Bir kez daha…','Son bir kez!','Açılıyor…'][BOX.taps];if(BOX.taps>=3)setTimeout(openBox,450)},
 toalbum(){tab='album';screen='home';renderHome()},
 card(b){const c=CARDS.find(x=>x.id===b.dataset.c);sheet(`<div style="text-align:center"><span class="rar r-${c.r}">${RAR[c.r]} kart</span>${cardArt(c,true)}<h3 style="margin-top:12px">${esc(c.tr)}</h3><div class="enname">${esc(c.en)}${HAS_TTS?` <button class="spk-mini" data-act="say" data-t="${esc(c.en)}" aria-label="Dinle">${I.speaker}</button>`:''}</div><p class="fact">${esc(c.f)}</p></div><button class="btn ghost" data-act="close">Kapat</button>`)},
 profiles(){closeSheet();renderProfiles()},
 useprof(b){useProfile(b.dataset.id)},
 addprof(){profSheet(null)},
 editprof(){profSheet(PID)},
 pickav(b){FORM.av=b.dataset.a;$$('.avb').forEach(x=>x.classList.toggle('sel',x===b))},
 kidsw(b){FORM.kid=!FORM.kid;b.setAttribute('aria-checked',FORM.kid)},
 saveprof(){
  const name=($('#pname').value||'').trim().slice(0,16)||'Öğrenci';
  if(FORM.id){const p=P.list.find(x=>x.id===FORM.id);const kidOn=FORM.kid&&!p.kid;Object.assign(p,{name,av:FORM.av,kid:FORM.kid});saveProfiles();if(kidOn&&FORM.id===PID){S.heartsOn=false;save()}closeSheet();screen==='profiles'?renderProfiles():renderHome();return}
  const id='p'+Date.now().toString(36);P.list.push({id,name,av:FORM.av,kid:FORM.kid});saveProfiles();
  const st=structuredClone(DEF);st.heartTs=Date.now();st.heartsOn=!FORM.kid;try{localStorage.setItem('dilbaz.p.'+id,JSON.stringify(st))}catch(e){}
  closeSheet();useProfile(id);
 },
 delprof(){const p=P.list.find(x=>x.id===FORM.id);sheet(`<h3>${esc(p.name)} silinsin mi?</h3><p>Bu profilin tüm ilerlemesi, kartları ve başarıları silinir. Bu işlem geri alınamaz.</p><button class="btn red" data-act="dodelprof" data-id="${p.id}">Profili sil</button><button class="btn ghost" data-act="close">Vazgeç</button>`)},
 dodelprof(b){const id=b.dataset.id;P.list=P.list.filter(x=>x.id!==id);try{localStorage.removeItem('dilbaz.p.'+id)}catch(e){}if(P.last===id)P.last=null;saveProfiles();closeSheet();if(id===PID){PID=null;renderProfiles()}else renderProfiles()},
 doReset(){S=structuredClone(DEF);S.heartTs=Date.now();save();applyTheme();closeSheet();tab='learn';viewLv=0;renderWelcome()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f)f(b,e)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#sheet-root').innerHTML){closeSheet();return}
  if(screen!=='lesson'||$('#sheet-root').innerHTML||!L)return;
  const inField=/^(TEXTAREA|INPUT)$/.test(e.target.tagName)&&!e.target.readOnly;
  if(e.key==='Enter'&&!e.shiftKey){const n=$('#nextBtn');if(n){e.preventDefault();n.click()}else if(L.ready&&!L.answered){e.preventDefault();doCheck()}else if(inField)e.preventDefault();return}
  if(inField||L.answered)return;
  const d=parseInt(e.key,10);
  if(d>=1&&d<=9){const bs=$$('#lbody [data-act="pickopt"],#lbody [data-act="opt"]');if(bs[d-1]){e.preventDefault();bs[d-1].click()}}
  if(e.key==='Backspace'){const t=$$('#ans .tile');if(t.length){e.preventDefault();t[t.length-1].click()}}
});

/* ---------- başlat ---------- */
function useProfile(id){
  PID=id;P.last=id;saveProfiles();S=loadState(id);applyTheme();rollDay();checkStreak();regen();questDay();save();
  viewLv=userLevel();tab='learn';scrollCur=true;L=null;
  if(S.started)renderHome();else renderWelcome();
  if(S.shieldUsed){const n=S.shieldUsed;S.shieldUsed=0;save();sheet(`<div style="font-size:72px;text-align:center">🛡️</div><h3 style="text-align:center">Seri kalkanı serini korudu!</h3><p style="text-align:center">${n} gün ara verdin ama ${S.streak} günlük serin bozulmadı. Bugün bir ders yaparak devam et.</p><button class="btn" data-act="close">Süper</button>`)}
}
if(P.list.length===1)useProfile(P.list[0].id);else renderProfiles();
</script>
<script>
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
